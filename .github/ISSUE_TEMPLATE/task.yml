name: Task
description: Track technical chores, fixes, and operational work
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - alexa
        - data
        - ci-cd
        - docs
    validations:
      required: true


name: Add issues and pull requests to project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    if: vars.PROJECT_URL != ''
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      # PROJECTS_TOKEN が未設定のときはスキップ(毎回失敗してメールが飛ぶのを防ぐ)。
      # トークンを設定すれば自動で有効化される。
      - if: env.PROJECTS_TOKEN != ''
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECTS_TOKEN }}

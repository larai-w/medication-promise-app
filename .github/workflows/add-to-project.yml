name: Add issues and pull requests to project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    if: vars.PROJECT_URL != ''
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      # Skip while PROJECTS_TOKEN is unset, so this does not fail every time and
      # send mail. It switches on by itself once the token is set.
      - if: env.PROJECTS_TOKEN != ''
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECTS_TOKEN }}

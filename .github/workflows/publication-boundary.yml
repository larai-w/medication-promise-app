name: Publication boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-publication-boundary.mjs

name: Deploy Alexa Lambda

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to confirm the production update
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # OIDC でロールを引き受けるために必要

concurrency:
  group: deploy-alexa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Alexa Lambda
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    environment: production-alexa
    defaults:
      run:
        working-directory: alexa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alexa/package-lock.json

      - run: npm ci
      - run: node --check index.mjs
      - run: npm test
      - run: npm run zip

      - name: Require deployment settings
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          LAMBDA_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$AWS_REGION_VALUE" ] || [ -z "$LAMBDA_NAME" ]; then
            echo "::error::Required Alexa production deployment settings are not configured."
            exit 1
          fi

      # 長期のアクセスキーではなく OIDC で一時認証する（2026-08-20 移行）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code
        env:
          LAMBDA_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://skill.zip \
            --no-cli-pager

          # The generic Lambda waiter calls GetFunction, which is not part of
          # the deploy user policy. Poll the narrower configuration API instead.
          update_status="InProgress"
          for attempt in $(seq 1 15); do
            update_status="$(aws lambda get-function-configuration \
              --function-name "$LAMBDA_NAME" \
              --query 'LastUpdateStatus' \
              --output text \
              --no-cli-pager)"
            case "$update_status" in
              Successful)
                break
                ;;
              Failed)
                echo "::error::Lambda code update failed."
                exit 1
                ;;
              InProgress)
                sleep 2
                ;;
              *)
                echo "::error::Unexpected Lambda update status: $update_status"
                exit 1
                ;;
            esac
          done

          if [ "$update_status" != "Successful" ]; then
            echo "::error::Lambda code update did not complete within the polling window."
            exit 1
          fi

          aws lambda get-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json \
            --no-cli-pager

name: CI / CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # CI: Web lint & build
  # ────────────────────────────────────────────
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ────────────────────────────────────────────
  # CI: Alexa syntax check & zip
  # ────────────────────────────────────────────
  alexa:
    name: Alexa package check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alexa/package-lock.json

      - run: npm ci
      - run: node --check index.mjs

      - name: Build Lambda zip
        run: npm run zip

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: alexa-skill-zip
          path: alexa/skill.zip
          if-no-files-found: error

  # ────────────────────────────────────────────
  # CD: Deploy Alexa Lambda  (main push only)
  #
  # 必要な GitHub Secrets（HUMAN_TASKS.md H-08 を参照）:
  #   AWS_ACCESS_KEY_ID
  #   AWS_SECRET_ACCESS_KEY
  #   AWS_REGION
  #   LAMBDA_FUNCTION_NAME
  # ────────────────────────────────────────────
  deploy-lambda:
    name: Deploy Alexa Lambda
    needs: alexa
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS secrets
        id: check
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          LAMBDA_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$LAMBDA_NAME" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS Secrets not set — skipping Lambda deploy. See HUMAN_TASKS.md H-08."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download Lambda artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: alexa-skill-zip

      - name: Configure AWS credentials
        if: steps.check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code
        if: steps.check.outputs.configured == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://skill.zip

  # ────────────────────────────────────────────
  # CD: Web は Amplify が GitHub 連携で自動デプロイ
  #     （GitHub Actions のジョブは不要）
  #     Amplify コンソールで GitHub リポジトリを接続すると
  #     main へのプッシュで自動ビルド＆デプロイが走る
  # ────────────────────────────────────────────

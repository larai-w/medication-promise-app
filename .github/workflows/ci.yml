name: CI / CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  care-event-schema-drift:
    name: Care-event schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: subject

      - name: Check out canonical care-event contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: larai-w/GutPacer-ParkinSync-Module
          path: canonical

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fail if the medication subset widens or drops canonical constraints
        run: |
          node subject/web/scripts/check-care-event-schema-drift.mjs \
            canonical/schema/care-event-v1.schema.json \
            subject/docs/schemas/medication-promise-export-v1.schema.json

  # ────────────────────────────────────────────
  # CI: Web lint & build
  # ────────────────────────────────────────────
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  # ────────────────────────────────────────────
  # CI: Alexa syntax check & zip
  # ────────────────────────────────────────────
  alexa:
    name: Alexa package check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alexa/package-lock.json

      - run: npm ci
      - run: node --check index.mjs
      - run: npm test

      - name: Build Lambda zip
        run: npm run zip

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alexa-skill-zip
          path: alexa/skill.zip
          if-no-files-found: error

  # ────────────────────────────────────────────
  # Production deploys are intentionally absent from this push/PR workflow.
  # Alexa uses deploy-alexa.yml (workflow_dispatch only).
  # Web uses the separately confirmed local SST deploy procedure.
  # ────────────────────────────────────────────
